aid: couchbase
name: Couchbase
kind: company
description: >-
  Couchbase is a distributed, document-oriented NoSQL cloud database platform that combines the flexibility of JSON, the
  power of SQL++ querying, and the performance of an in-memory key-value store. The Couchbase product line includes
  Couchbase Server (self-managed), Couchbase Capella (fully managed database-as-a-service across AWS, Azure, and Google
  Cloud), Sync Gateway and App Services for mobile and edge synchronization, and Couchbase Lite embedded databases.
  Couchbase exposes a comprehensive set of REST APIs covering cluster administration, SQL++ query execution, full-text
  and vector search, analytics, eventing, backup, cross data center replication, and Capella management.
url: https://raw.githubusercontent.com/api-evangelist/couchbase/refs/heads/main/apis.yml
accessModel:
  pricing: freemium
  onboarding: self-serve
  trial: false
  try_now: true
  public: false
  label: Freemium · Self-serve signup
  confidence: high
  source:
  - plans
  - authentication
  generated: '2026-07-22'
  method: derived
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/couchbase.png
type: Index
access: Public
position: Provider
tags:
  - Analytics
  - App Services
  - Backup
  - Capella
  - Cloud
  - Database
  - DBaaS
  - Eventing
  - Full-Text Search
  - Gateway
  - JSON
  - Mobile
  - NoSQL
  - Replication
  - SQL++
