          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: db-_resync
      path: /{db}/_resync
      operations:
      - name: resyncdatabase
        method: POST
        description: Resync database
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
