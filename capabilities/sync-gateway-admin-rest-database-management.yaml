      operations:
      - name: getsyncfunction
        method: GET
        description: Get sync function
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updatesyncfunction
        method: PUT
        description: Update sync function
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: db-_offline
