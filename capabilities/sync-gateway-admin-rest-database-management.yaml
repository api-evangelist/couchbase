    resources:
    - name: db-_compact
      path: /{db}/_compact
      operations:
      - name: compactdatabase
        method: POST
        description: Compact database
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: db-_config
      path: /{db}/_config
      operations:
      - name: getdatabaseconfig
        method: GET
        description: Get database configuration
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updatedatabaseconfig
        method: PUT
        description: Update database configuration
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: createdatabase
        method: POST
        description: Create a database
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deletedatabase
