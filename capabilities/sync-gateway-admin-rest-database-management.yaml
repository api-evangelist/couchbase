        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: db-_purge
      path: /{db}/_purge
      operations:
      - name: purgedocuments
