naftiko: 1.0.0-alpha2
info:
  label: Couchbase Server REST API — Buckets
  description: 'Couchbase Server REST API — Buckets. 5 operations. Lead operation: List all buckets. Self-contained Naftiko
    capability covering one Couchbase business surface.'
  tags:
  - Couchbase
  - Buckets
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    COUCHBASE_API_KEY: COUCHBASE_API_KEY
capability:
  consumes:
  - type: http
    namespace: server-rest-buckets
    baseUri: https://localhost:8091
    description: Couchbase Server REST API — Buckets business capability. Self-contained, no shared references.
    resources:
    - name: pools-default-buckets
      path: /pools/default/buckets
      operations:
      - name: listbuckets
        method: GET
        description: List all buckets
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createbucket
        method: POST
        description: Create a new bucket
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: pools-default-buckets-bucketName
      path: /pools/default/buckets/{bucketName}
      operations:
      - name: getbucket
        method: GET
        description: Get bucket details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updatebucket
        method: POST
        description: Update bucket settings
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deletebucket
        method: DELETE
        description: Delete a bucket
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: basic
      username: '{{env.COUCHBASE_USER}}'
      password: '{{env.COUCHBASE_PASS}}'
  exposes:
  - type: rest
    namespace: server-rest-buckets-rest
    port: 8080
    description: REST adapter for Couchbase Server REST API — Buckets. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/pools/default/buckets
      name: pools-default-buckets
      description: REST surface for pools-default-buckets.
      operations:
      - method: GET
        name: listbuckets
        description: List all buckets
        call: server-rest-buckets.listbuckets
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createbucket
        description: Create a new bucket
        call: server-rest-buckets.createbucket
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/pools/default/buckets/{bucketname}
      name: pools-default-buckets-bucketname
      description: REST surface for pools-default-buckets-bucketName.
      operations:
      - method: GET
        name: getbucket
        description: Get bucket details
        call: server-rest-buckets.getbucket
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: updatebucket
        description: Update bucket settings
        call: server-rest-buckets.updatebucket
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deletebucket
        description: Delete a bucket
        call: server-rest-buckets.deletebucket
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: server-rest-buckets-mcp
    port: 9090
    transport: http
    description: MCP adapter for Couchbase Server REST API — Buckets. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-all-buckets
      description: List all buckets
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: server-rest-buckets.listbuckets
      outputParameters:
      - type: object
        mapping: $.
    - name: create-new-bucket
      description: Create a new bucket
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: server-rest-buckets.createbucket
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-bucket-details
      description: Get bucket details
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: server-rest-buckets.getbucket
      outputParameters:
      - type: object
        mapping: $.
    - name: update-bucket-settings
      description: Update bucket settings
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: server-rest-buckets.updatebucket
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-bucket
      description: Delete a bucket
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: server-rest-buckets.deletebucket
      outputParameters:
      - type: object
        mapping: $.
