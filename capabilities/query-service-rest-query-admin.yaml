      operations:
      - name: getpreparedstatement
        method: GET
        description: Get a prepared statement
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: name
          in: path
          type: string
          description: The name of the prepared statement
          required: true
      - name: deletepreparedstatement
        method: DELETE
        description: Delete a prepared statement
