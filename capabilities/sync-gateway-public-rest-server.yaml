naftiko: 1.0.0-alpha2
info:
  label: Couchbase Sync Gateway Public REST API — Server
  description: 'Couchbase Sync Gateway Public REST API — Server. 1 operations. Lead operation: Get server information. Self-contained
    Naftiko capability covering one Couchbase business surface.'
  tags:
  - Couchbase
  - Server
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    COUCHBASE_API_KEY: COUCHBASE_API_KEY
capability:
  consumes:
  - type: http
    namespace: sync-gateway-public-rest-server
    baseUri: https://localhost:4984
    description: Couchbase Sync Gateway Public REST API — Server business capability. Self-contained, no shared references.
    resources:
    - name: root
      path: /
      operations:
      - name: getserverinfo
        method: GET
        description: Get server information
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: SyncGatewaySession
      value: '{{env.COUCHBASE_API_KEY}}'
      placement: cookie
  exposes:
  - type: rest
    namespace: sync-gateway-public-rest-server-rest
    port: 8080
    description: REST adapter for Couchbase Sync Gateway Public REST API — Server. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1
      name: root
      description: REST surface for root.
      operations:
      - method: GET
        name: getserverinfo
        description: Get server information
        call: sync-gateway-public-rest-server.getserverinfo
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: sync-gateway-public-rest-server-mcp
    port: 9090
    transport: http
    description: MCP adapter for Couchbase Sync Gateway Public REST API — Server. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: get-server-information
      description: Get server information
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: sync-gateway-public-rest-server.getserverinfo
      outputParameters:
      - type: object
        mapping: $.
