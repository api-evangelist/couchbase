name: Couchbase Server Capabilities
description: >-
  Workflow capabilities exposed by the Couchbase Server REST API for cluster
  initialization, bucket lifecycle, node operations, and security management.
url: https://docs.couchbase.com/server/current/rest-api/rest-intro.html
version: '1.0'
modified: '2026-04-28'
api: Couchbase Server REST API
baseURL: https://localhost:8091
capabilities:
  - name: Cluster Initialization
    description: Provision a new Couchbase cluster, set credentials, and join nodes.
    inputs:
      - admin credentials
      - cluster name
      - service plan
    outputs:
      - initialized cluster
  - name: Bucket Lifecycle
    description: Create, configure, flush, and delete buckets with quota and replica settings.
    inputs:
      - bucket name
      - RAM quota
      - replica count
    outputs:
      - bucket configuration
  - name: Node Operations
    description: Add, remove, fail-over, and rebalance nodes in a Couchbase cluster.
    inputs:
      - node hostname
      - service list
    outputs:
      - rebalance status
  - name: Security Management
    description: Manage local users, roles, certificates, and audit settings on the cluster.
    inputs:
      - user definition
      - role assignments
    outputs:
      - RBAC configuration
useCases:
  - name: Automated Cluster Provisioning
    description: Use the Server REST API to bootstrap a Couchbase cluster from infrastructure-as-code pipelines.
    capabilities:
      - Cluster Initialization
      - Node Operations
  - name: Multi-Tenant Bucket Provisioning
    description: Programmatically create per-tenant buckets with RAM quotas and replica targets.
    capabilities:
      - Bucket Lifecycle
      - Security Management
  - name: Operational Health
    description: Run scheduled rebalance and security audits across a fleet of clusters.
    capabilities:
      - Node Operations
      - Security Management
