naftiko: 1.0.0-alpha2
info:
  label: Couchbase Sync Gateway Public REST API — Database
  description: 'Couchbase Sync Gateway Public REST API — Database. 1 operations. Lead operation: Get database information.
    Self-contained Naftiko capability covering one Couchbase business surface.'
  tags:
  - Couchbase
  - Database
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    COUCHBASE_API_KEY: COUCHBASE_API_KEY
capability:
  consumes:
  - type: http
    namespace: sync-gateway-public-rest-database
    baseUri: https://localhost:4984
    description: Couchbase Sync Gateway Public REST API — Database business capability. Self-contained, no shared references.
    resources:
    - name: db
      path: /{db}
      operations:
      - name: getdatabaseinfo
        method: GET
        description: Get database information
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: SyncGatewaySession
      value: '{{env.COUCHBASE_API_KEY}}'
      placement: cookie
  exposes:
  - type: rest
    namespace: sync-gateway-public-rest-database-rest
    port: 8080
    description: REST adapter for Couchbase Sync Gateway Public REST API — Database. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/{db}
      name: db
      description: REST surface for db.
      operations:
      - method: GET
        name: getdatabaseinfo
        description: Get database information
        call: sync-gateway-public-rest-database.getdatabaseinfo
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: sync-gateway-public-rest-database-mcp
    port: 9090
    transport: http
    description: MCP adapter for Couchbase Sync Gateway Public REST API — Database. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: get-database-information
      description: Get database information
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: sync-gateway-public-rest-database.getdatabaseinfo
      outputParameters:
      - type: object
        mapping: $.
