name: Couchbase Capella Management Capabilities
description: >-
  Workflow capabilities exposed by the Couchbase Capella Management API for
  provisioning and operating cloud-hosted Couchbase database deployments.
url: https://docs.couchbase.com/cloud/management-api-reference/index.html
version: '1.0'
modified: '2026-04-28'
api: Couchbase Capella Management API
baseURL: https://cloudapi.cloud.couchbase.com
capabilities:
  - name: Cluster Provisioning
    description: Create, scale, and destroy Capella database clusters across AWS, Azure, and GCP.
    inputs:
      - cloud provider
      - region
      - service plan
    outputs:
      - deployed cluster
  - name: Bucket and Scope Management
    description: Manage Capella buckets, scopes, and collections via REST.
    inputs:
      - bucket name
      - quotas
    outputs:
      - bucket configuration
  - name: Access Management
    description: Provision database users, project access, and API keys with role-based access control.
    inputs:
      - user identity
      - project assignment
      - role list
    outputs:
      - access credentials
  - name: Organisation and Project Operations
    description: Manage Capella organisations, projects, billing, and audit configuration.
    inputs:
      - organisation id
      - project definition
    outputs:
      - organisational metadata
useCases:
  - name: Infrastructure-as-Code Provisioning
    description: Provision and tear down ephemeral Capella clusters for staging or test environments.
    capabilities:
      - Cluster Provisioning
      - Bucket and Scope Management
  - name: Multi-Tenant Onboarding
    description: Onboard customer tenants with scoped projects, buckets, and database users.
    capabilities:
      - Organisation and Project Operations
      - Bucket and Scope Management
      - Access Management
