openapi: 3.2.0
info:
  title: Couchbase Server API
  version: '3.1'
  contact:
    name: Couchbase Support
    url: https://support.couchbase.com
  termsOfService: https://www.couchbase.com/terms-of-use
  description: 'Operations tagged Server across 2 of this provider''s published API definitions: couchbase-sync-gateway-admin-rest-api-openapi.yml, couchbase-sync-gateway-public-rest-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://localhost:4985
  description: Sync Gateway Admin REST API (default port)
- url: https://localhost:4984
  description: Sync Gateway Public REST API (default port)
tags:
- name: Server
  description: Endpoints for managing the Sync Gateway server instance.
paths:
  /_all_dbs:
    get:
      operationId: listDatabases
      summary: List all databases
      description: Returns the names of all databases configured on the Sync Gateway instance.
      tags:
      - Server
      responses:
        '200':
          description: Successful retrieval of database list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '401':
          description: Unauthorized access
      security:
      - basicAuth: []
    servers:
    - url: https://localhost:4985
      description: Sync Gateway Admin REST API (default port)
  /_config:
    get:
      operationId: getServerConfig
      summary: Get server configuration
      description: Returns the complete Sync Gateway server configuration.
      tags:
      - Server
      responses:
        '200':
          description: Successful retrieval of server configuration
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Unauthorized access
      security:
      - basicAuth: []
    servers:
    - url: https://localhost:4985
      description: Sync Gateway Admin REST API (default port)
  /:
    get:
      operationId: getServerInfo
      summary: Get server information
      description: Returns information about the Sync Gateway server instance.
      tags:
      - Server
      security: []
      responses:
        '200':
          description: Successful retrieval of server information
          content:
            application/json:
              schema:
                type: object
                properties:
                  couchdb:
                    type: string
                    description: CouchDB compatibility string
                  vendor:
                    type: object
                    properties:
                      name:
                        type: string
                      version:
                        type: string
                  version:
                    type: string
                    description: Sync Gateway version
    servers:
    - url: https://localhost:4984
      description: Sync Gateway Public REST API (default port)
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic Authentication with admin credentials or RBAC user with appropriate roles.
    sessionAuth:
      type: apiKey
      in: cookie
      name: SyncGatewaySession
      description: Session cookie from the _session endpoint.
x-refined-from:
- couchbase-sync-gateway-admin-rest-api-openapi.yml
- couchbase-sync-gateway-public-rest-api-openapi.yml
