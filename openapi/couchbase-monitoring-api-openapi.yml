openapi: 3.2.0
info:
  title: Couchbase Sync Gateway Admin REST Monitoring API
  description: The Couchbase Sync Gateway Admin REST API provides administrative endpoints for configuring and managing Sync Gateway instances. It supports database management, user and role administration, sync function configuration, and replication setup. The API is intended for server-side administration and is typically bound to localhost for security, enabling full control over Sync Gateway behavior, access control policies, and data synchronization rules.
  version: '3.1'
  contact:
    name: Couchbase Support
    url: https://support.couchbase.com
  termsOfService: https://www.couchbase.com/terms-of-use
servers:
- url: https://localhost:4985
  description: Sync Gateway Admin REST API (default port)
security:
- basicAuth: []
tags:
- name: Monitoring
  description: Endpoints for monitoring Sync Gateway health and performance.
paths:
  /_expvar:
    get:
      operationId: getExpvar
      summary: Get runtime statistics
      description: Returns runtime statistics for the Sync Gateway instance.
      tags:
      - Monitoring
      responses:
        '200':
          description: Successful retrieval of statistics
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Unauthorized access
  /_status:
    get:
      operationId: getServerStatus
      summary: Get server status
      description: Returns the status of the Sync Gateway server and its databases.
      tags:
      - Monitoring
      responses:
        '200':
          description: Successful retrieval of server status
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                  databases:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        state:
                          type: string
                        name:
                          type: string
        '401':
          description: Unauthorized access
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic Authentication with admin credentials or RBAC user with appropriate roles.
externalDocs:
  description: Couchbase Sync Gateway Admin REST API Documentation
  url: https://docs.couchbase.com/sync-gateway/current/rest-api-admin.html
