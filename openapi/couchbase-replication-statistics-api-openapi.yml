openapi: 3.1.0
info:
  title: Couchbase Analytics Service REST Allowed CIDRs Replication Statistics API
  description: The Couchbase Analytics Service REST API provides access to the Analytics service for running complex analytical queries on operational data without impacting performance of key-value operations. It supports SQL++ queries for analytics, management of links to external data sources, and configuration of user-defined libraries. The service enables real-time analytics on JSON data alongside transactional workloads.
  version: '7.6'
  contact:
    name: Couchbase Support
    url: https://support.couchbase.com
  termsOfService: https://www.couchbase.com/terms-of-use
servers:
- url: https://localhost:8095
  description: Analytics Service (default port)
- url: https://localhost:18095
  description: Analytics Service (SSL)
security:
- basicAuth: []
tags:
- name: Replication Statistics
  description: Endpoints for monitoring replication progress and performance statistics.
paths:
  /pools/default/buckets/{bucketName}/stats/{statName}:
    get:
      operationId: getReplicationStats
      summary: Get XDCR replication statistics
      description: Returns statistics for XDCR replications on a specific bucket, including items replicated, replication latency, and bandwidth usage.
      tags:
      - Replication Statistics
      parameters:
      - name: bucketName
        in: path
        required: true
        description: The name of the source bucket
        schema:
          type: string
      - name: statName
        in: path
        required: true
        description: The specific statistic to retrieve (e.g., replications/{replicationId}/docs_written)
        schema:
          type: string
      responses:
        '200':
          description: Successful retrieval of replication statistics
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Unauthorized access
        '404':
          description: Bucket or statistic not found
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic Authentication using Couchbase Server credentials.
externalDocs:
  description: Couchbase Analytics Service REST API Documentation
  url: https://docs.couchbase.com/server/current/analytics/rest-analytics.html
