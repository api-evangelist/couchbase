openapi: 3.2.0
info:
  title: Couchbase Eventing Service REST Logging API
  description: The Couchbase Eventing Service REST API provides methods for deploying and managing Eventing Functions that respond to data changes in real time. Eventing Functions allow developers to write server-side JavaScript logic triggered by document mutations, timers, or external events. The API supports creating, deploying, pausing, and undeploying functions, as well as monitoring their execution status and statistics.
  version: '7.6'
  contact:
    name: Couchbase Support
    url: https://support.couchbase.com
  termsOfService: https://www.couchbase.com/terms-of-use
servers:
- url: https://localhost:8096
  description: Eventing Service (default port)
- url: https://localhost:18096
  description: Eventing Service (SSL)
security:
- basicAuth: []
tags:
- name: Logging
  description: Endpoints for retrieving Eventing Function application logs.
paths:
  /api/v1/functions/{functionName}/applog:
    get:
      operationId: getEventingFunctionLog
      summary: Get Eventing Function application log
      description: Returns the most recent application log messages generated by the specified Eventing Function via the log() function in handler code.
      tags:
      - Logging
      parameters:
      - $ref: '#/components/parameters/functionName'
      - name: aggregate
        in: query
        required: false
        description: Whether to aggregate logs from all nodes
        schema:
          type: boolean
          default: true
      responses:
        '200':
          description: Successful retrieval of application log
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '401':
          description: Unauthorized access
        '404':
          description: Function not found
components:
  parameters:
    functionName:
      name: functionName
      in: path
      required: true
      description: The name of the Eventing Function
      schema:
        type: string
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic Authentication using Couchbase Server credentials.
externalDocs:
  description: Couchbase Eventing Service REST API Documentation
  url: https://docs.couchbase.com/server/current/eventing/eventing-api.html
